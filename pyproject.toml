[project]
name = "bookrag"
version = "0.0.1"
description = "RAG tool for ingesting .epub/.pdf books and querying spoiler-safe character, setting, and theme catalogs."
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.optional-dependencies]
# Ingestion + storage: epub/pdf parsing.
core = [
    "ebooklib",
    "pymupdf",
]
# Pluggable LLM backends (Claude via Anthropic API, local/open-source via Ollama)
# plus the eval harness to compare extraction/query output across them.
providers = [
    "anthropic",
    "python-dotenv",
]
dev = [
    "pytest",
]

[project.scripts]
bookrag = "bookrag.cli:main"

[tool.pytest.ini_options]
# Makes `from tests.helpers import ...` resolve regardless of how pytest is
# invoked. Without this, `python -m pytest` works (python -m prepends the
# cwd to sys.path) but the bare `pytest` console script does not - tests/
# has no __init__.py, so pytest's own path insertion only adds tests/
# itself, never the project root, and "tests" can't resolve as a package.
# Real failure this fixes: CI (which runs the bare `pytest` script, not
# `python -m pytest`) failed with "ModuleNotFoundError: No module named
# 'tests'" on every test file that imports tests.helpers.
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bookrag"]
